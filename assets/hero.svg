<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Aayush Bankar — Systems Security Researcher">
<title>Aayush Bankar :: Systems Security Researcher</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050811"/>
    <stop offset="50%" stop-color="#090e1a"/>
    <stop offset="100%" stop-color="#03050a"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
    <stop offset="50%" stop-color="#0284c7" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
  </pattern>
  <linearGradient id="cyanText" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="50%" stop-color="#00e5ff"/>
    <stop offset="100%" stop-color="#7dd3fc"/>
  </linearGradient>
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="320" fill="url(#bg)" rx="12"/>
<rect width="1200" height="320" fill="url(#grid)" rx="12"/>
<rect width="1200" height="320" fill="url(#glow)" rx="12"/>
<rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#1e293b" stroke-width="1" rx="12"/>

<!-- Top Window Header -->
<rect x="0" y="0" width="1200" height="36" fill="#0b1120" rx="12"/>
<rect x="0" y="24" width="1200" height="12" fill="#0b1120"/>
<line x1="0" y1="36" x2="1200" y2="36" stroke="#1e293b" stroke-width="1"/>
<circle cx="24" cy="18" r="5" fill="#ef4444"/>
<circle cx="42" cy="18" r="5" fill="#eab308"/>
<circle cx="60" cy="18" r="5" fill="#22c55e"/>
<text x="120" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#64748b">aayush@research-node :: ~/sec/operations</text>

<!-- Main Terminal Typography -->
<g transform="translate(60, 95)">
  <!-- Prompt line -->
  <text x="0" y="10" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#38bdf8">&gt; whoami --system-target</text>
  
  <!-- Main Name Title -->
  <text x="0" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-weight="900" font-size="52" fill="url(#cyanText)" letter-spacing="2" filter="url(#softGlow)">AAYUSH BANKAR</text>
  
  <!-- Subtitle -->
  <text x="0" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-weight="600" font-size="15" fill="#94a3b8" letter-spacing="2">SYSTEMS SECURITY RESEARCHER // EXPLOIT REPRODUCTION // SOVEREIGN ARCHITECTURES</text>
  
  <!-- Status Bar Line -->
  <rect x="0" y="140" width="1080" height="32" fill="#0b1120" rx="6" stroke="#1e293b" stroke-width="1"/>
  <circle cx="16" cy="156" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="161" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#38bdf8">CURRENT FOCUS:</text>
  <text x="150" y="161" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#cbd5e1">CVE-2026-46242 Kernel Epoll UAF · CVE-2026-28576 Android SQLi · SIH 2026 SPECTRE-PRISM</text>
</g>
</svg>

  <text x="16" y="32" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#38bdf8">PHASE 01</text>
  <text x="16" y="54" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#f8fafc">SURFACE TRIAGE</text>
